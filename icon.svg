<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9eef7"/><stop offset="1" stop-color="#b9c4d8"/></linearGradient>
    <linearGradient id="grey" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b4b9c0"/><stop offset=".5" stop-color="#d7dbe0"/><stop offset="1" stop-color="#9ea4ad"/></linearGradient>
    <linearGradient id="greyv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2e5e9"/><stop offset="1" stop-color="#a9afb8"/></linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#eef0f3"/><stop offset="1" stop-color="#cfd3d9"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7d8590"/><stop offset=".45" stop-color="#e4e7ea"/><stop offset="1" stop-color="#7d8590"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <ellipse cx="350" cy="452" rx="120" ry="16" fill="#5b6475" opacity=".28"/>
  <!-- base: colonna grigia -->
  <path d="M286 300 h130 v128 q0 14 -14 14 h-102 q-14 0 -14 -14 z" fill="url(#grey)"/>
  <rect x="286" y="300" width="130" height="22" rx="8" fill="#eef0f3" opacity=".7"/>
  <rect x="312" y="384" width="78" height="44" rx="6" fill="#7b828c"/>
  <g stroke="#a9afb8" stroke-width="3"><line x1="322" y1="394" x2="380" y2="394"/><line x1="322" y1="404" x2="380" y2="404"/><line x1="322" y1="414" x2="380" y2="414"/></g>
  <rect x="268" y="428" width="166" height="20" rx="6" fill="#8f96a1"/>
