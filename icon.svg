  <path d="M138 262 h210 q34 0 34 32 v10 q0 32 -34 32 h-210 z" fill="url(#greyv)"/>
  <rect x="138" y="262" width="244" height="14" rx="7" fill="#fff" opacity=".45"/>
  <!-- secondo braccio bianco (carter a cupola) -->
  <path d="M52 238 q0 -92 82 -92 q96 0 134 40 q22 22 22 60 v22 q0 36 -36 36 h-138 q-64 0 -64 -66z" fill="url(#white)"/>
  <path d="M52 262 h224" stroke="#c9ced6" stroke-width="5"/>
