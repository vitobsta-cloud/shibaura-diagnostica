  <!-- fascia decorativa neutra -->
  <path d="M98 200 q40 -34 110 -6" fill="none" stroke="#2f5fbf" stroke-width="9" stroke-linecap="round"/>
  <!-- asse (quill) -->
  <rect x="82" y="74" width="26" height="92" rx="8" fill="url(#steel)"/>
  <rect x="68" y="66" width="54" height="16" rx="7" fill="url(#steel)"/>
  <rect x="86" y="284" width="18" height="86" rx="6" fill="url(#steel)"/>
  <rect x="62" y="366" width="66" height="30" rx="10" fill="#262a31"/>
  <rect x="68" y="370" width="54" height="8" rx="4" fill="#4a505a"/>
